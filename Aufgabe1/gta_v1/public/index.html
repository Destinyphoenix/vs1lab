<!doctype html>

<!-- File origin: VS1LAB A1a -->

<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>GeoTagApp</title>
        <link rel="stylesheet" href="./stylesheets/style.css" />
    </head>

    <body>
        <header class="header">
            <img
                src="./images/location.png"
                class="header__image"
                alt="an image of a map and location"
            />
            <h1 class="header__title">GeoTagApp</h1>
            <nav class="header__navigation">
                <a href="#">About</a> | <a href="#">Help</a> |
                <a href="/">Home</a>
            </nav>
        </header>

        <!-- Grid: main ist die äußere Reihe (Flexbox) mit zwei Spalten, 3 + 9 = 12 Teile -->
        <main class="main row">
            <!-- linke Spalte: Tagging-Widget (3 von 12 Teilen) -->
            <section class="main__tagging tagging col-3">
                <h2>Tagging</h2>

                <!-- ############### VS1Lab 1a Form 1 Start -->
                <form
                    class="tagging__form"
                    id="tag-form"
                    action="/tagging"
                    method="post"
                >
                    <fieldset>
                        <legend>Add a new GeoTag</legend>

                        <!-- feste Koordinaten: readonly = sichtbar, aber nicht änderbar; step="any" erlaubt Nachkommastellen -->
                        <label for="tag-latitude">Latitude:</label>
                        <input
                            id="tag-latitude"
                            type="number"
                            name="latitude"
                            value="49.00937"
                            placeholder="e.g. 49.00937"
                            step="any"
                            readonly
                        />

                        <label for="tag-longitude">Longitude:</label>
                        <input
                            id="tag-longitude"
                            type="number"
                            name="longitude"
                            value="8.40444"
                            placeholder="e.g. 8.40444"
                            step="any"
                            readonly
                        />

                        <!-- Pflichtfeld, höchstens 10 Buchstaben -->
                        <label for="tag-name">Name:</label>
                        <input
                            id="tag-name"
                            type="text"
                            name="name"
                            placeholder="e.g. Castle"
                            pattern="[A-Za-zÄÖÜäöüß]{1,10}"
                            maxlength="10"
                            required
                        />

                        <!-- optional; wenn ausgefüllt: # gefolgt von 1-10 Buchstaben -->
                        <label for="tag-hashtag">Hashtag:</label>
                        <input
                            id="tag-hashtag"
                            type="text"
                            name="hashtag"
                            placeholder="e.g. #sight"
                            pattern="#[A-Za-zÄÖÜäöüß]{1,10}"
                            maxlength="11"
                        />

                        <input type="submit" value="Add Tag" />
                    </fieldset>
                </form>
                <!-- ############### VS1Lab 1a Form 1 End -->
            </section>

            <!-- rechte Spalte: Discovery-Widget (9 von 12 Teilen) -->
            <section class="main__discovery discovery col-9">
                <h2 class="discovery__title">Discovery</h2>

                <!-- ############### VS1Lab 1a Form 2 Start -->
                <form
                    class="discovery__search"
                    id="discoveryFilterForm"
                    action="/discovery"
                    method="post"
                >
                    <fieldset>
                        <legend>Search</legend>

                        <label for="dis-searchterm">Search term or keywords:</label>
                        <input
                            id="dis-searchterm"
                            type="text"
                            name="searchterm"
                            placeholder="e.g. #sight"
                        />

                        <!-- versteckte Koordinaten: werden mitgeschickt, damit in der Nähe gesucht werden kann -->
                        <input
                            id="dis-latitude"
                            type="hidden"
                            name="latitude"
                            value="49.00937"
                        />
                        <input
                            id="dis-longitude"
                            type="hidden"
                            name="longitude"
                            value="8.40444"
                        />

                        <input type="submit" value="Search" />
                    </fieldset>
                </form>
                <!-- ############### VS1Lab 1a Form 2 End -->

                <!-- verschachtelte Reihe: Prozente beziehen sich auf die Discovery-Spalte, 4 + 8 = 12 Teile -->
                <div class="discovery__wrapper row">
                    <!-- Ergebnisliste (4 von 12 Teilen) -->
                    <div class="discovery__taglist col-4">
                        <ul class="discovery__results" id="discoveryResults">
                            <li>Castle (49.01379, 8.404435) #sight</li>
                            <li>IWI (49.01379, 8.390071) #edu</li>
                        </ul>
                    </div>

                    <!-- Karte (8 von 12 Teilen) -->
                    <div id="map" class="discovery__map col-8">
                        <img
                            src="./images/mapview.jpg"
                            alt="a map with locations"
                            id="mapView"
                        />
                        <span>Result map</span>
                    </div>
                </div>
            </section>
        </main>

        <footer class="footer">
            <span>(c) 2026 HKA_IWI_VSYS</span>
        </footer>
    </body>
</html>
